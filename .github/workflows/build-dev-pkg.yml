name: Build local J804 developer pkg

on:
  push:
    branches:
      - build-j804-dev-pkg
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dev-pkg:
    if: github.repository == 'stefanodvx/aurora-installer'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      AURORA_DEVELOPER_BUILD: '1'
      AURORA_ENABLE_OMARCHY: '0'
    defaults:
      run:
        shell: bash
        working-directory: macOS
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: aurora-silicon/aurora-distributions
          path: delivery
          sparse-checkout: |
            site/installer/Profiles
          persist-credentials: false

      - name: Prepare tools and signed catalogs
        run: |
          set -euo pipefail
          if [[ ! -x /opt/homebrew/bin/bash ]]; then brew install bash; fi
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          python3 - "$RUNNER_TEMP/alpha-catalogs" <<'PY'
          from pathlib import Path
          import os, shutil, sys
          root = Path(sys.argv[1])
          source = Path(os.environ['GITHUB_WORKSPACE']) / 'delivery/site/installer/Profiles'
          expected = {f'{d}-{s}' for d in ('fedora', 'arch', 'nixos') for s in ('kde', 'gnome', 'minimal')}
          for profile in expected:
              dest = root / 'Profiles' / profile
              dest.mkdir(parents=True, exist_ok=True)
              for name in ('release.json', 'trust-root.ed25519.pub', 'catalog.json', 'catalog.json.sig'):
                  shutil.copyfile(source / profile / name, dest / name)
          PY

      - name: Run NativeFirmwareSelectionTests
        run: |
          set -euo pipefail
          xcrun swift test --filter NativeFirmwareSelectionTests

      - name: Build developer app and pkg
        run: |
          set -euo pipefail
          python3 scripts/prepare-distribution-release.py \
            --profiles "$RUNNER_TEMP/alpha-catalogs/Profiles" \
            --output "$RUNNER_TEMP/release" \
            --sealed
          python3 - "$RUNNER_TEMP/release" <<'PY'
          import glob, json, sys
          base = sys.argv[1]
          for p in [base + "/release.json"] + glob.glob(base + "/Profiles/*/release.json"):
              with open(p) as f:
                  d = json.load(f)
              d["helper_code_signing_requirement"] = 'identifier "org.aurorasilicon.installer.helper"'
              with open(p, "w") as f:
                  json.dump(d, f, indent=2)
                  f.write("\n")
          PY
          export AURORA_APP_BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          /opt/homebrew/bin/bash Packaging/build-app.sh "$RUNNER_TEMP/release" "$RUNNER_TEMP/application"
          /opt/homebrew/bin/bash Packaging/build-developer-pkg.sh \
            "$RUNNER_TEMP/application/Aurora Installer.app" \
            "$RUNNER_TEMP/Aurora-Installer-j804-fix.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-Installer-j804-fix-pkg
          path: ${{ runner.temp }}/Aurora-Installer-j804-fix.pkg
          if-no-files-found: error
